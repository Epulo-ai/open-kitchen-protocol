name: Sync Hugging Face

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/validate_okp.py --strict examples/*.json
      - name: Build public snapshot
        env:
          SNAPSHOT_SHA: ${{ github.sha }}
        run: python3 tools/build_hf_snapshot.py --revision "$SNAPSHOT_SHA" --output "$RUNNER_TEMP/hf-check"

  publish:
    needs: validate
    if: github.repository == 'Epulo-ai/open-kitchen-protocol' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip obsolete runs
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/Epulo-ai/open-kitchen-protocol/commits/main --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded revision $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install publishing client
        if: steps.current.outputs.publish == 'true'
        run: python3 -m pip install 'huggingface_hub==1.19.0'
      - name: Build snapshot
        if: steps.current.outputs.publish == 'true'
        run: python3 tools/build_hf_snapshot.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/hf-snapshot"
      - name: Publish via trusted publisher
        if: steps.current.outputs.publish == 'true'
        env:
          HF_OIDC_RESOURCE: datasets/Epulo-ai/open-kitchen-protocol
        run: hf upload Epulo-ai/open-kitchen-protocol "$RUNNER_TEMP/hf-snapshot" . --repo-type dataset --commit-message "Align with GitHub $GITHUB_SHA"
      - name: Verify published bytes
        if: steps.current.outputs.publish == 'true'
        run: python3 tools/verify_hf_snapshot.py "$RUNNER_TEMP/hf-snapshot"
